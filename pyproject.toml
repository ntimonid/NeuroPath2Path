[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuropath2path"
version = "0.1.0"
description = "Path-wise comparison, classification, and SRVF morphing of neuronal arbors"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
neuropath2path = "neuropath2path.cli:main"

[tool.setuptools.packages.find]
include = ["neuropath2path*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
